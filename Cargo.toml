[package]
name = "crypto"
version = "6.7.5"
authors = ["Rivtower Technologies <contact@rivtower.com>"]
license = "Apache-2.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tonic = "0.14"
prost = "0.14"
tokio = { version = "1.49", features = ["full"] }
hex = "0.4"
tower = "0.5"
libsm = "0.6"
efficient-sm2 = "0.2"
rayon = "1.11"
serde = "1.0"
serde_derive = "1.0"
tracing = "0.1"

cloud-util = { package = "cloud-util", git = "https://github.com/cita-cloud/cloud-common-rs", branch = "update" }
cita_cloud_proto = { package = "cita_cloud_proto", git = "https://github.com/cita-cloud/cloud-common-rs", branch = "update" }

[profile.release.package."*"]
# Set the default for dependencies.
debug = 0

[profile.release]
# Add debug info -- line tables only
debug = 1
